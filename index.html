<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigBoost</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-bottom: 12px;
    }

    p {
      color: #6b7280;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .pro {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
    }

    .price {
      font-size: 30px;
      font-weight: bold;
      margin: 15px 0;
    }

    #dashboard {
      display: none;
    }

    .logout {
      background: #dc2626;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h2>GigBoost</h2>
</header>

<div class="container">

  <!-- LOGIN / SIGN UP -->
  <div class="card" id="loginSection">

    <h1>Turn Your Skills Into Income 🚀</h1>

    <p>
      Create your GigBoost account and get access to tools
      designed to help freelancers grow.
    </p>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
    >

    <button onclick="signUp()">
      Create Account
    </button>

    <button onclick="login()">
      Login
    </button>

    <div id="message"></div>

  </div>


  <!-- DASHBOARD -->
  <div class="card" id="dashboard">

    <h1>Welcome to GigBoost 🎉</h1>

    <p id="userEmail"></p>

    <div class="pro">

      <h2>GigBoost Pro</h2>

      <div class="price">
        ₦5,000 / month
      </div>

      <p>
        Unlock the full GigBoost experience.
      </p>

      <a
        href="https://paystack.shop/pay/tgv56-mcew"
        target="_blank"
        style="text-decoration:none;"
      >
        <button>
          Get GigBoost Pro
        </button>
      </a>

    </div>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </div>

</div>


<script>

  // =====================================
  // SUPABASE CONNECTION
  // =====================================

  const SUPABASE_URL =
    "https://guseeksjsvhfcqpwokgd.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_jmsw_Ysc9_5GYnKr0asG3w_QiMi7t07";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // =====================================
  // CREATE ACCOUNT
  // =====================================

  async function signUp() {

    const email =
      document.getElementById("email").value.trim();

    const message =
      document.getElementById("message");


    if (!email) {

      message.innerText =
        "Please enter your email.";

      return;
    }


    const { error } =
      await supabaseClient.auth.signUp({
        email: email
      });


    if (error) {

      message.innerText =
        error.message;

      return;
    }


    message.innerText =
      "Account created! Check your email to confirm your account.";
  }


  // =====================================
  // LOGIN
  // =====================================

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const message =
      document.getElementById("message");


    if (!email) {

      message.innerText =
        "Please enter your email.";

      return;
    }


    const { error } =
      await supabaseClient.auth.signInWithOtp({
        email: email
      });


    if (error) {

      message.innerText =
        error.message;

      return;
    }


    message.innerText =
      "Login link sent! Check your email.";
  }


  // =====================================
  // CHECK USER
  // =====================================

  async function checkUser() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();


    if (session) {

      document.getElementById(
        "loginSection"
      ).style.display = "none";


      document.getElementById(
        "dashboard"
      ).style.display = "block";


      document.getElementById(
        "userEmail"
      ).innerText = session.user.email;
    }
  }


  // =====================================
  // LOGOUT
  // =====================================

  async function logout() {

    await supabaseClient.auth.signOut();


    document.getElementById(
      "dashboard"
    ).style.display = "none";


    document.getElementById(
      "loginSection"
    ).style.display = "block";
  }


  // Check for an existing login
  checkUser();

</script>

</body>
  </html>
